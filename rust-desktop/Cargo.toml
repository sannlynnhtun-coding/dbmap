[package]
name = "dbmaps-desktop"
version = "1.0.1"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.9.0"
wry = { version = "=0.57.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
percent-encoding = "2"
mime_guess = "2"
rfd = { version = "0.17", features = ["common-controls-v6"] }
rust-embed = { version = "=8.13.0", features = ["debug-embed"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[build-dependencies]
embed-resource = "=3.0.12"

[[bin]]
name = "DBMaps"
path = "src/main.rs"
